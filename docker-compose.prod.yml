services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3004
      TRUST_PROXY: "true"
      DB_SSL: "true"
      SUPABASE_AUTH_ENABLED: "true"
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    networks:
      - carniceria_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SUPABASE_AUTH_ENABLED: ${VITE_SUPABASE_AUTH_ENABLED:-true}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    networks:
      - carniceria_internal
    depends_on:
      backend:
        condition: service_healthy

networks:
  carniceria_internal:
    driver: bridge
