name: keep-supabase-alive

# Mantiene despierto el proyecto de Supabase (plan free) ejecutando una
# consulta trivial contra la base. Supabase pausa el proyecto tras ~7 dias
# de inactividad de la base, asi que corremos un SELECT cada 3 dias.

on:
  schedule:
    - cron: '0 6 */3 * *' # cada 3 dias a las 06:00 UTC
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta fantasma (keep-alive)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL en el repositorio."
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1 AS keep_alive;'
          echo "Keep-alive ejecutado correctamente: $(date -u)"
